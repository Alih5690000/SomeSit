<!DOCTYPE html>
<html>
    <head>
        <title>Test</title>
    </head>

    <body>
        <div class="menu">
            <a class="menu_text">MENU</a>
            <a class="menu_text" href="best.html" id="bestLink">BEST SCORE</a>
        </div>
        <br><br><br><br>
        <h1 align="center">That's test</h1>
        <p align="center" id="question">Question</p>
        <a align="center" id="answer"></a>
        <br>
        <div class="Button_inside">
            <button id="test_button1" class="test_button">
                Button
            </button>
        </div>
        <div class="Button_inside">
            <button id="test_button2" class="test_button">
                Button
            </button>
        </div>
        <div class="Button_inside">
            <button id="test_button3" class="test_button">
                Button
            </button>
        </div>
        <br>
        <div class="Button_inside">
            <button align="center" id="answer_button">Check</button>
        </div>
        <div class="Button_inside">
            <button align="center" id="next_button">Next</button>
        </div>
    </body>

    <style>
        body  {
            font-family: "Times New Roman";
        }
        #bestLink{
            color: black;
            text-decoration: none;
        }
        #bestLink:hover{
            color: grey;
        }
        .menu_text{
            font: 30px "Times New Roman";
        }
        .menu{
            background: rgb(97, 97, 97);
            width: 100%;
            height: 100px;
            position:fixed;
            top: 0;
            left:0;
        }
        .Button_inside{
            width: 100%;
        }
        .test_button{
            background:rgb(255, 255, 255);
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 0 10px 10px 0;
            width: 75%;
            margin-left: 10px;
            font: 25px "Times New Roman", sans-serif;
            text-align: left;
        }
        .test_button:hover{
            box-shadow: 5px 5px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            transform: translate(5px,-5px);
        }
        .test_button.selected::before{
            content:"V ";
        }
        #answer_button{
            background:rgb(255, 255, 255);
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 10px 10px 10px 10px;
            width: 100px;
            margin-left: 10px;
            font: "New Times Roman";
            font-size: 25px;
            text-align: center;
            display: none;
            margin: 0 auto;
        }
        #answer_button:hover{
            box-shadow: 5px 5px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            transform: translate(5px,-5px);
        }
        #next_button{
            background:rgb(255, 255, 255);
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 0 10px 10px 0;
            width: 75%;
            margin-left: 10px;
            font: 25px "Times New Roman", sans-serif;
            text-align: left;
        }
        #next_button:hover{
            box-shadow: 5px 5px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            transform: translate(5px,-5px);
        }
        a {
            font: 15px "Times New Roman", sans-serif;
            display: block;
            width: 100%;
            text-align: center;
        }
    </style>

    <script src=script.js></script>
</html>
