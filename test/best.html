<!DOCTYPE html>
<head>
    <title>Your Best Score</title>
    <style>
    #best_score{
        font-family:'Times New Roman', Times, serif;
        font-size: 15px;
    }
    #score{
        background-color: rgb(131, 131, 131);
        width:50%;
        height: 200px;
        margin-left: 25%;
    }
    #box{
        position: relative;
        background-color: brown;
        width: 75%;
        height: 40px;
        margin-left: 12.5%;
    }
    #up_box{
        position: absolute;
        background-color: green;
        width: 10px;
        height: 40px;
        margin-left: 0;
    }
</style>
</head>

<body>
    <div id="score">
        <h1 id="bestScore" align="center"></h1>
        <br><br>
        <div id="box"></div>
        <div id="up_box"></div>
    </div>
</body>
